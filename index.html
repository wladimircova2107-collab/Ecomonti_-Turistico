<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONTI TURÍSTICO - Explora lo mejor de Montes</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #0d9488;
            --primary-hover: #0f766e;
            --secondary-color: #f59e0b;
            --dark-color: #1e293b;
            --light-bg: #f8fafc;
            --white: #ffffff;
            --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--light-bg);
            color: var(--dark-color);
            line-height: 1.6;
        }

        /* Hero Section / Bienvenida */
        .hero {
            background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(15, 23, 42, 0.75)), 
                        url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
            color: var(--white);
            text-align: center;
            padding: 90px 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .hero h1 {
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: #5eead4;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hero p {
            font-size: 1.25rem;
            max-width: 750px;
            margin: 0 auto;
            font-weight: 300;
        }

        /* Contenedor Principal */
        .container {
            max-width: 1200px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .section-title {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 35px;
            color: var(--dark-color);
            position: relative;
        }

        .section-title::after {
            content: '';
            width: 70px;
            height: 4px;
            background-color: var(--primary-color);
            display: block;
            margin: 10px auto 0;
            border-radius: 2px;
        }

        /* Grid de 4 Cuadritos */
        .destinos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
            gap: 25px;
        }

        /* Tarjeta de Destino */
        .card {
            background: var(--white);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15);
        }

        .card-img-wrapper {
            position: relative;
            height: 220px;
            overflow: hidden;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover .card-img {
            transform: scale(1.08);
        }

        .card-tag {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: var(--secondary-color);
            color: var(--white);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .card-content {
            padding: 22px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-title {
            font-size: 1.3rem;
            color: var(--dark-color);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .card-description {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .btn-card {
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: background-color 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-card:hover {
            background-color: var(--primary-hover);
        }

        /* Modal / Ventana Flotante */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--white);
            width: 100%;
            max-width: 650px;
            max-height: 90vh;
            border-radius: 20px;
            overflow-y: auto;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-header-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.85);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--dark-color);
            transition: background 0.2s;
        }

        .close-btn:hover {
            background: var(--white);
        }

        .modal-body {
            padding: 25px;
        }

        .modal-title {
            font-size: 1.6rem;
            color: var(--dark-color);
            margin-bottom: 15px;
        }

        .modal-info-block {
            margin-bottom: 18px;
            background: #f1f5f9;
            padding: 14px 18px;
            border-radius: 12px;
            border-left: 4px solid var(--primary-color);
        }

        .modal-info-block h4 {
            color: var(--primary-hover);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.05rem;
        }

        .modal-info-block p {
            color: #334155;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 25px 20px;
            background: #0f172a;
            color: #94a3b8;
            margin-top: 60px;
            font-size: 0.9rem;
        }

        /* Responsivo */
        @media (max-width: 600px) {
            .hero h1 { font-size: 2rem; }
            .hero p { font-size: 1rem; }
            .modal-body { padding: 18px; }
        }
    </style>
</head>
<body>

    <!-- Encabezado / Bienvenida -->
    <header class="hero">
        <h1>MONTI TURÍSTICO</h1>
        <p>Explora lo mejor de Montes: Tu guía definitiva para descubrir la magia, la cultura, los ríos y los senderos naturales de nuestro municipio.</p>
    </header>

    <!-- Contenido Principal -->
    <main class="container">
        <h2 class="section-title">Destinos Turísticos Imperdibles</h2>
        
        <div class="destinos-grid" id="destinosGrid">
            <!-- Las 4 tarjetas se autogeneran dinámicamente con JavaScript -->
        </div>
    </main>

    <!-- Modal / Ventana Emergente -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <button class="close-btn" id="closeBtn">&times;</button>
            <img src="" alt="Imagen Destino" class="modal-header-img" id="modalImg">
            <div class="modal-body">
                <h3 class="modal-title" id="modalTitle"></h3>
                <div id="modalDetails"></div>
            </div>
        </div>
    </div>

    <!-- Pie de Página -->
    <footer>
        <p>&copy; 2026 MONTI TURÍSTICO - Municipio Montes. Todos los derechos reservados.</p>
    </footer>

    <!-- Lógica de Interacción -->
    <script>
        // Datos de los 4 Destinos Turísticos
        const destinosTuristicos = [
            {
                id: 1,
                nombre: "Balneario Los Dos Ríos",
                tag: "Tradicional",
                imagen: "https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=800&q=80",
                resumen: "El Corazón Tradicional de Cumanacoa. El punto de encuentro por excelencia de locales y visitantes.",
                detalles: [
                    {
                        titulo: "📍 Ubicación",
                        texto: "A tan solo 10 minutos de Cumanacoa, siguiendo la vía hacia el estado Monagas."
                    },
                    {
                        titulo: "🌿 Tradición y Alegría",
                        texto: "Un sitio emblemático y famoso de toda la vida. Durante los fines de semana, días de vacaciones y temporadas como Semana Santa, Los Dos Ríos se convierte en el punto predilecto de encuentro para familias enteras y visitantes que vienen a disfrutar de la auténtica hospitalidad de la región."
                    },
                    {
                        titulo: "💧 La Experiencia",
                        texto: "Caracterizado por la confluencia de corrientes de agua cristalina y refrescante. Es el lugar ideal para un chapuzón revitalizante al aire libre y funciona como el punto estratégico perfecto para conectar con las rutas hacia Agua Blanca."
                    }
                ]
            },
            {
                id: 2,
                nombre: "Ruta Gastronómica",
                tag: "Sabor y Cultura",
                imagen: "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=800&q=80",
                resumen: "Un recorrido de sabor, cultura y tradición que comienza en el corazón de Cumanacoa.",
                detalles: [
                    {
                        titulo: "📍 Punto de Partida",
                        texto: "La aventura gastronómica inicia desde el bulevar en Cumanacoa (junto al emblemático monumento del bandolín morocho)."
                    },
                    {
                        titulo: "👩‍🍳 Parada: Comunidad El Rincón",
                        texto: "Disfruta de una mesa tradicional con dulces típicos y delicias locales como la representativa arepa de cambur."
                    },
                    {
                        titulo: "🪵 Parada: Casa de la Sra. Antonia Quijada",
                        texto: "Vive la experiencia de elaborar el casabe artesanal, desde prensar la yuca fresca hasta hornearlo directamente en el budare tradicional."
                    }
                ]
            },
            {
                id: 3,
                nombre: "Ruta Agrocomunitaria: Hacia la Cueva del Tigre",
                tag: "Aventura MINTUR",
                imagen: "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=800&q=80",
                resumen: "Un sendero nacido del esfuerzo comunitario y el amor por nuestras montañas. Espacio virgen en contacto directo con la naturaleza.",
                detalles: [
                    {
                        titulo: "📍 Ubicación",
                        texto: "Comunidad El Maco, Berrat (Ruta oficial validada por el Ministerio del Poder Popular para el Turismo - MINTUR)."
                    },
                    {
                        titulo: "⏱️ Duración de la Ruta",
                        texto: "Aproximadamente 1 hora y media de caminata en medio de una vegetación exuberante."
                    },
                    {
                        titulo: "🎒 La Experiencia",
                        texto: "Un emocionante ascenso por un sendero de montaña que cuenta con múltiples pozas naturales ideales para un baño refrescante."
                    },
                    {
                        titulo: "⛰️ El Gran Final",
                        texto: "La llegada a la majestuosa Cueva del Tigre, donde el trabajo de la comunidad y la aventura se unen para un recuerdo inolvidable."
                    }
                ]
            },
            {
                id: 4,
                nombre: "Cataratas de Agua Blanca",
                tag: "Exploración",
                imagen: "https://images.unsplash.com/photo-1432405972618-c60b0225b8f9?auto=format&fit=crop&w=800&q=80",
                resumen: "Un recorrido de pura exploración y senderismo para los amantes de la aventura y el agua.",
                detalles: [
                    {
                        titulo: "📍 Ubicación",
                        texto: "Partiendo desde el sector Los Dos Ríos hacia el camino interno de Agua Blanca."
                    },
                    {
                        titulo: "🎒 La Experiencia",
                        texto: "Senderismo de pura aventura entre rocas, riachuelos y pozas cristalinas que se forman a lo largo del trayecto."
                    },
                    {
                        titulo: "🌪️ El Gran Final: La Catarata del Viento",
                        texto: "Una imponente y majestuosa caída de agua en lo más profundo de la montaña que corona esta emocionante travesía."
                    }
                ]
            }
        ];

        // Elementos del DOM
        const grid = document.getElementById('destinosGrid');
        const modalOverlay = document.getElementById('modalOverlay');
        const closeBtn = document.getElementById('closeBtn');
        const modalImg = document.getElementById('modalImg');
        const modalTitle = document.getElementById('modalTitle');
        const modalDetails = document.getElementById('modalDetails');

        // Renderizar Tarjetas
        function cargarDestinos() {
            grid.innerHTML = destinosTuristicos.map(destino => `
                <div class="card" onclick="abrirModal(${destino.id})">
                    <div class="card-img-wrapper">
                        <img src="${destino.imagen}" alt="${destino.nombre}" class="card-img">
                        <span class="card-tag">${destino.tag}</span>
                    </div>
                    <div class="card-content">
                        <div>
                            <h3 class="card-title">${destino.nombre}</h3>
                            <p class="card-description">${destino.resumen}</p>
                        </div>
                        <button class="btn-card">
                            <i class="fa-solid fa-compass"></i> Ver Guía Completa
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Abrir Modal
        function abrirModal(id) {
            const destino = destinosTuristicos.find(item => item.id === id);
            if (!destino) return;

            modalImg.src = destino.imagen;
            modalImg.alt = destino.nombre;
            modalTitle.innerText = destino.nombre;

            modalDetails.innerHTML = destino.detalles.map(item => `
                <div class="modal-info-block">
                    <h4>${item.titulo}</h4>
                    <p>${item.texto}</p>
                </div>
            `).join('');

            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // Cerrar Modal
        function cerrarModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // Eventos de Cierre
        closeBtn.addEventListener('click', cerrarModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) cerrarModal();
        });

        // Inicializar
        cargarDestinos();
    </script>
</body>
</html>
